<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Love ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:#000;
color:#00ff88;
font-family:monospace;
text-align:center;
}


.card{
margin:40px auto;
width:90%;
padding:25px;
background:rgba(0,255,100,0.08);
border:2px solid #00ff88;
border-radius:25px;
box-shadow:0 0 30px #00ff88;
}


h1{
color:#ff00ff;
font-size:35px;
text-shadow:0 0 20px #ff00ff;
}


.line{
height:3px;
margin:20px;
background:#00ff88;
box-shadow:0 0 20px #00ff88;
}


.loveText{
font-size:20px;
line-height:2;
font-weight:bold;
}


.word{
animation:colorChange 1s infinite;
}


@keyframes colorChange{

0%{color:#00ff88;}
25%{color:#00ffff;}
50%{color:#ff00ff;}
75%{color:#ffff00;}
100%{color:#ff3366;}

}


.heart{
position:absolute;
font-size:25px;
animation:up 5s linear;
}


@keyframes up{

from{
bottom:-50px;
}

to{
bottom:110%;
opacity:0;
}

}

</style>

</head>


<body>


<div class="card">

<h1>
❤️ Gitanjali ❤️
</h1>


<div class="line"></div>


<div class="loveText" id="loveText"></div>


<div class="line"></div>


<h2>
💞 Forever Together 💞
</h2>


</div>


<script>

let msg = `❤️ Meri Pyari Gitanjali ❤️
🌸 Agar khushi ka koi chehra hota, to woh tumhari muskaan hoti.
💞 Meri har dua mein sirf tum ho, aur meri har khushi ki wajah bhi tum hi ho.
🌹 I Love You Forever... Always & Forever. 😘`;


let box=document.getElementById("loveText");

let i=0;


function typeLove(){

if(i < msg.length){

let span=document.createElement("span");

span.className="word";


if(msg[i]=="\n"){
span.innerHTML="<br>";
}
else{
span.innerHTML=msg[i];
}


box.appendChild(span);

i++;

setTimeout(typeLove,80);

}

}


typeLove();



setInterval(()=>{

let h=document.createElement("div");

h.className="heart";

h.innerHTML="💚";

h.style.left=Math.random()*100+"%";

document.body.appendChild(h);


setTimeout(()=>{
h.remove();
},5000);


},500);


</script>


</body>
</html>
